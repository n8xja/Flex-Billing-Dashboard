# MSP Partner Console for Sophos Central partners
#   Start:   docker compose up -d --build
#   Stop:    docker compose down
#   Logs:    docker compose logs -f
#
# The ':z' on each folder lets containers use it on servers with SELinux
# (Rocky / Red Hat). It is ignored on servers without SELinux (Ubuntu).
#
# Hardening: no container can gain extra privileges, and the two Python
# containers (which run as an ordinary user) have every Linux capability removed.

services:
  # Pulls data from Sophos every day (and when you press "Collect fresh data now")
  collector:
    build: .
    command: ["python", "-m", "app.collector"]
    env_file: .env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./data:/data:z
    restart: unless-stopped

  # The web dashboard. Not reachable directly; only through the https proxy below.
  web:
    build: .
    env_file: .env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      # The web page never needs the Sophos secret
      SOPHOS_CLIENT_ID: ""
      SOPHOS_CLIENT_SECRET: ""
    volumes:
      - ./data:/data:z
      - ./branding:/branding:ro,z
    expose:
      - "8501"
    restart: unless-stopped

  # Encrypts the web traffic (https). Makes its own certificate on first start.
  proxy:
    build: ./nginx
    security_opt: ["no-new-privileges:true"]
    ports:
      # LISTEN_ADDRESS (optional) limits the dashboard to one of the server's addresses
      - "${LISTEN_ADDRESS:+${LISTEN_ADDRESS}:}${HTTPS_PORT:-443}:443"
      - "${LISTEN_ADDRESS:+${LISTEN_ADDRESS}:}${HTTP_PORT:-80}:80"
    environment:
      CERT_NAME: ${SERVER_NAME:-partner-console}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./certs:/etc/nginx/certs:z
    depends_on:
      - web
    restart: unless-stopped
